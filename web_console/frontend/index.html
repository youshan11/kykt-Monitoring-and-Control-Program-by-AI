<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project1 Agent Console</title>
    <link rel="stylesheet" href="/styles.css?v=13" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-pane" aria-label="Agent 对话">
        <header class="topbar">
          <div>
            <h1>Project1 Agent Console</h1>
            <p id="configStatus">读取配置状态中...</p>
          </div>
          <div class="topbar-actions">
            <button id="previewConfig" type="button">预览 DOCX</button>
            <label class="upload-button">
              上传 DOCX
              <input id="configFile" type="file" accept=".docx" />
            </label>
          </div>
        </header>

        <section id="configDraftBanner" class="draft-banner" hidden>
          <div>
            <strong>配置修改中</strong>
            <p id="configDraftText">草稿未保存，确认前不能启动采样。</p>
          </div>
          <div class="draft-actions">
            <button id="confirmConfigDraft" type="button">确认修改文件</button>
            <button id="discardConfigDraft" type="button">放弃修改</button>
          </div>
        </section>

        <div id="messages" class="messages"></div>

        <div class="bottom-controls">
          <form id="chatForm" class="composer">
            <textarea id="messageInput" rows="2" placeholder="输入要发给 agent 的自然语言命令"></textarea>
            <button id="sendButton" type="submit">发送</button>
          </form>

          <div class="quick-actions" aria-label="快捷操作">
            <button data-message="开始采样" data-block-draft="true">开始执行</button>
            <button data-message="确认启动" data-block-draft="true">确认启动</button>
            <button data-message="停止采样">停止执行</button>
            <button data-message="确认停止">确认停止</button>
            <button data-message="查看当前采样状态">查询状态</button>
          </div>
        </div>
      </section>

      <aside class="side-pane" aria-label="结果和对话记录">
        <section class="panel">
          <div class="panel-title">
            <h2>TDMS 文件</h2>
            <button id="refreshFiles" type="button">刷新</button>
          </div>
          <div id="tdmsFiles" class="file-list"></div>
        </section>

        <section class="panel config-history-panel">
          <div class="panel-title">
            <h2>配置历史</h2>
          </div>
          <div id="configHistory" class="config-history-list"></div>
        </section>

        <section class="panel conversation-panel">
          <div class="panel-title">
            <h2>对话记录</h2>
            <button id="newConversation" type="button">新对话</button>
          </div>
          <div id="conversations" class="conversation-list"></div>
        </section>
      </aside>
    </main>

    <section id="previewModal" class="preview-modal" hidden aria-label="配置文档预览">
      <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview-header">
          <div>
            <h2 id="previewTitle">配置文档预览</h2>
            <p id="previewMeta" class="preview-meta"></p>
          </div>
          <div class="preview-actions">
            <button id="refreshPreview" type="button">刷新</button>
            <button id="closePreview" type="button">关闭</button>
          </div>
        </header>
        <pre id="previewContent" class="preview-content">读取中...</pre>
      </div>
    </section>

    <script src="/app.js?v=13"></script>
  </body>
</html>
